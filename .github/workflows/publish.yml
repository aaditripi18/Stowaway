# Publish to PyPI when a version tag (v0.2.0, ...) is pushed, with PyPI's
# Trusted Publishing: no API token is stored anywhere. One-time setup on
# pypi.org: Account -> Publishing -> add a pending publisher for project
# "stowaway-scan", owner "aaditripi18", repository "Stowaway", workflow "publish.yml",
# environment "pypi".
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
