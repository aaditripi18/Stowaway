# Every push and pull request: the Python suite, the browser build's suite
# (including byte-identical parity with Python), the page-number gate, and a
# production build of the site.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Tests, including the page-number gate
        # The two page facts read from downloaded weights need models/, which
        # CI does not fetch; every ledger fact and claim is still checked.
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests (parity with the Python golden reports)
        run: npx vitest run
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
