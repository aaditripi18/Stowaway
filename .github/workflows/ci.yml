# Every push and pull request: the Python suite, the browser build's suite
# (including byte-identical parity with Python), the page-number gate, and a
# production build of the site.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only torch; torch only writes test fixtures)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then python -m pip install torch; else python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install -e ".[dev]"
      - name: Tests, including the page-number gate
        # The two page facts read from downloaded weights need models/, which
        # CI does not fetch; every ledger fact and claim is still checked.
        run: python -m pytest -q

  minimal:
    # The scanner itself needs only numpy: install it alone and scan fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Scan fixtures with the bare install
        run: |
          set +e
          stowaway scan web/fixtures/clean.safetensors; test $? -eq 0 || exit 1
          stowaway scan web/fixtures/trailing_mz.safetensors; test $? -eq 2 || exit 1
          stowaway scan web/fixtures/pytorch/legacy_evil.pt; test $? -eq 2 || exit 1
          stowaway scan web/fixtures/s5/poisoned.safetensors --base web/fixtures/s5/base.safetensors; test $? -eq 2 || exit 1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tests (parity with the Python golden reports)
        run: npx vitest run
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CLI image
        run: docker build -t stowaway .
      - name: The image scans a file (trailing executable bytes -> exit 2)
        run: |
          set +e
          docker run --rm -v "$PWD/web/fixtures:/data" stowaway scan /data/trailing_mz.safetensors
          test $? -eq 2
